name: Auto Update Data

on:
  schedule:
    # 每天 UTC 08:00 (台灣時間 16:00 股市收盤後) 自動執行
    - cron: '0 8 * * *'
  workflow_dispatch: # 支援在 GitHub 頁面手動點擊按鈕觸發執行

# 必須賦予 write 權限，Actions 才能將更新後的 data.json 推回 Repository
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 開啟套件快取以加速執行速度

      # 3. 安裝 Python 相依套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 執行抓取數據的 Python 腳本
      - name: Fetch market data
        run: |
          python fetch_data.py

      # 5. 將更新後的 data.json 提交並推回 Repository
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          # 檢查是否有檔案變更，有變更才進行 Commit 與 Push，避免產生無效紀錄
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update data.json [skip ci]" && git push)
