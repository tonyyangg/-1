name: Auto Update Market Data

on:
  schedule:
    # 台灣時間 (UTC+8) 盤中與盤後定時更新 (Cron 使用 UTC 時間)
    # 每週一至週五 UTC 00:30-06:00 (台灣時間 08:30-14:00) 每 10 分鐘執行一次
    - cron: '*/10 0-6 * * 1-5'
    # 台灣時間 15:30 (UTC 07:30) 抓取盤後籌碼與法人數據
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 頁面上手動點擊觸發執行

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas finmind

      - name: Fetch and Process Data
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }} # 可在 Repo Settings -> Secrets 新增 Token（可選）
        run: |
          python main.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
