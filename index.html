<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時盤中動態儀表板</title>
  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121824; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 120px0;
      margin: 0 auto;
    }

    /* 卡片通用樣式 */
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      background-color: #0f172a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .update-time {
      font-size: 12px;
      color: #64748b;
    }

    /* 重新整理按鈕樣式 */
    .btn-refresh {
      background-color: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      background-color: #475569;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .card-body { padding: 16px; }

    /* 旋轉動畫 */
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* 內容數值顯示樣式範例 */
    .metric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .metric-val { font-size: 24px; font-weight: bold; color: #38bdf8; }
    .badge-tag { background: #065f46; color: #34d399; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

<div class="dashboard-grid">

  <!-- 卡片 1：當沖即時動態指標 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span style="color:#10b981;">●</span> 當沖即時動態指標 (REAL-TIME)
      </div>
      <div class="header-actions">
        <!-- 手動更新按鈕 1 -->
        <button class="btn-refresh" onclick="manualRefresh('intraday')">
          <i class="fas fa-sync-alt" id="icon-intraday"></i> 重新整理
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="metric-row">
        <span>期現貨價差 (Basis)</span>
        <span class="badge-tag">正價差 (偏多)</span>
      </div>
      <div class="metric-val" id="val-basis">+18.5 點</div>
      <hr style="border:0; border-top:1px solid #334155; margin: 12px 0;">
      <div class="update-time" id="time-intraday">最後更新：尚未更新</div>
    </div>
  </div>

  <!-- 卡片 2：TAIEX 加權指數與樞紐區塊 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">TAIEX 加權指數</div>
      <div class="header-actions">
        <span class="update-time" id="time-taiex">更新時間：2026-10-02 --:--:--</span>
        <!-- 手動更新按鈕 2 -->
        <button class="btn-refresh" onclick="manualRefresh('taiex')">
          <i class="fas fa-sync-alt" id="icon-taiex"></i> 重新整理
        </button>
      </div>
    </div>
    <div class="card-body">
      <div class="metric-row">
        <span>當前指數</span>
        <span class="metric-val" id="val-taiex" style="color: #f43f5e;">48,353.49</span>
      </div>
      <div style="color: #f43f5e; font-size: 14px;">+413.36 (+0.86%)</div>
    </div>
  </div>

</div>

<script>
  // 1. 手動更新通用觸發函式
  async function manualRefresh(blockType) {
    const icon = document.getElementById(`icon-${blockType}`);
    if (icon) icon.classList.add('spin'); // 開啟旋轉動畫

    try {
      if (blockType === 'intraday') {
        await fetchIntradayData();
      } else if (blockType === 'taiex') {
        await fetchTaiexData();
      }
    } catch (err) {
      console.error(`更新 ${blockType} 時發生錯誤:`, err);
    } finally {
      // 延遲 500ms 停止轉圈，提升視覺回饋感
      setTimeout(() => {
        if (icon) icon.classList.remove('spin');
      }, 500);
    }
  }

  // 2. 抓取「當沖即時動態指標」（加 t=timestamp 強制不使用快取）
  async function fetchIntradayData() {
    const timestamp = Date.now();
    // 範例 API（請替換為您的實際 API Endpoint）
    const apiUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&t=${timestamp}`;

    try {
      // 實際專案中請取消註解下方 fetch：
      // const res = await fetch(apiUrl);
      // const data = await res.json();
      
      // 更新 UI 畫面與時間戳記
      const now = new Date();
      document.getElementById('time-intraday').innerText = `最後更新：${now.toLocaleTimeString()}`;
      console.log('當沖數據手動更新成功');
    } catch (error) {
      console.error('當沖數據更新失敗', error);
    }
  }

  // 3. 抓取「TAIEX 即時指數」（使用 TWSE 證交所盤中即時 API 防止抓到歷史日）
  async function fetchTaiexData() {
    const timestamp = Date.now();
    // 使用 TWSE 官方盤中即時 API
    const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_t00.tw&_=${timestamp}`;

    try {
      // 實際專案中請取消註解下方 fetch：
      // const res = await fetch(twseUrl);
      // const data = await res.json();
      
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${now.toLocaleTimeString()}`;
      document.getElementById('time-taiex').innerText = `更新時間：${timeStr}`;
      console.log('TAIEX 指數手動更新成功');
    } catch (error) {
      console.error('TAIEX 更新失敗', error);
    }
  }

  // 初次載入時自動執行一次
  window.addEventListener('DOMContentLoaded', () => {
    manualRefresh('intraday');
    manualRefresh('taiex');
  });
</script>
</body>
</html>
